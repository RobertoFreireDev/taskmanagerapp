<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0f1115">
    <meta name="description" content="Offline task manager. Your data stays on this device.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tasks">
    <title>Task Manager</title>
    <link rel="apple-touch-icon" href="img/icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="css/app.css">
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div id="app">
      <header id="app-header" class="app-header"></header>
      <main id="view" class="view"></main>
      <nav id="tabbar" class="tabbar" aria-label="Main"></nav>
    </div>
    <div id="overlay-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
    <noscript><p class="noscript">Task Manager needs JavaScript.</p></noscript>
  </body>
</html>
